<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Pizza | Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1d6, #ffcf99);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 8px;
        }

        .tagline {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e65100;
        }

        .password-box {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 13px;
            cursor: pointer;
            font-size: 13px;
            color: #e65100;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #e65100;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #bf360c;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }

        .login-link a {
            color: #e65100;
            text-decoration: none;
            font-weight: bold;
        }

        .messages {
            margin-bottom: 15px;
            color: #c62828;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">🍕 PYTHON PIZZA</div>

        <p class="tagline">
            Fresh Pizza, Delicious Moments!
        </p>

        <h2>Create Your Account</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Create password"
                        required
                        minlength="8"
                    >

                    <span
                        class="toggle"
                        onclick="togglePassword('password')"
                    >
                        Show
                    </span>

                </div>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        placeholder="Confirm password"
                        required
                        minlength="8"
                    >

                    <span
                        class="toggle"
                        onclick="togglePassword('confirm_password')"
                    >
                        Show
                    </span>

                </div>

            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

    <script>

        function togglePassword(id) {

            let password = document.getElementById(id);

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }

    </script>

</body>

</html>
